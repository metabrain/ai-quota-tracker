[package]
name = "ai-quota-tracker"
version = "0.1.0"
edition = "2021"
description = "RAM-only AI API quota tracking daemon served over a Unix domain socket"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
libc = "0.2"                     # umask(2) — create the socket 0600 with no race
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Lean, fast binary: small idle footprint, quick cold start.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
